<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>長期禁慾挑戰</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #eee;
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 0.8s;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    z-index: -1;
    pointer-events: none;
  }
  .screen {
    width: 100%;
    max-width: 480px;
    padding: 24px 20px;
    position: relative;
    z-index: 1;
  }
  h1 { font-size: 1.7rem; color: #ff4d6d; margin-bottom: 16px; }
  p { line-height: 1.65; margin-bottom: 14px; font-size: 1.05rem; }
  input[type="number"] {
    width: 80px;
    padding: 8px;
    font-size: 1.1rem;
    text-align: center;
    border-radius: 8px;
    border: 1px solid #555;
    background: #1a1a1a;
    color: #fff;
    margin: 0 6px;
  }
  .upload-area {
    margin: 18px 0;
    padding: 14px;
    border: 1px dashed #666;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
  }
  .upload-area label { display: block; margin-bottom: 8px; color: #ccc; }
  input[type="file"] { color: #ddd; width: 100%; }
  button {
    background: #ff4d6d;
    color: white;
    border: none;
    padding: 14px 36px;
    font-size: 1.15rem;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 16px;
    transition: 0.2s;
  }
  button:active { transform: scale(0.96); }
  button.secondary {
    background: #333;
    border: 1px solid #ff4d6d;
    color: #ffb3c1;
  }
  #day-display {
    font-size: 2.8rem;
    font-weight: bold;
    color: #ff4d6d;
    margin: 12px 0 20px;
  }
  #message {
    font-size: 1.35rem;
    min-height: 3em;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  #countdown {
    font-size: 5.5rem;
    font-weight: bold;
    color: #ff4d6d;
    text-shadow: 0 0 25px #ff4d6d;
    margin: 20px 0;
    display: none;
  }
  #status {
    font-size: 0.95rem;
    color: #aaa;
    margin-top: 18px;
  }
  .hidden { display: none !important; }
  .success { color: #7CFC00; }
  .fail { color: #ff6b6b; }
</style>
</head>
<body>

<!-- 開始設定畫面 -->
<div id="setup-screen" class="screen">
  <h1>長期禁慾挑戰</h1>
  <p>設定你願意挑戰的天數區間。<br>
  系統會在這個區間內隨機抽出一個「秘密射精日」，你看不到這個數字。<br>
  每天由你自己點「下一天」推進。</p>

  <div style="margin: 20px 0;">
    從 <input type="number" id="min-days" value="10" min="3" max="60"> 天
    到 <input type="number" id="max-days" value="20" min="5" max="90"> 天
  </div>

  <div class="upload-area">
    <label>可選：上傳 1～多張照片（射精日或假射精日時會作為背景）</label>
    <input type="file" id="photo-upload" accept="image/*" multiple>
  </div>

  <button id="start-btn">開始挑戰</button>
</div>

<!-- 日常畫面 -->
<div id="day-screen" class="screen hidden">
  <div id="day-display">第 1 天</div>
  <div id="message">今天不准射精</div>
  <button id="next-day-btn" class="secondary">下一天</button>
  <div id="status"></div>
</div>

<!-- 射精日 / 假射精日 倒數畫面 -->
<div id="orgasm-screen" class="screen hidden">
  <div id="orgasm-title" style="font-size:1.5rem; margin-bottom:12px;"></div>
  <div id="countdown">100</div>
  <div id="orgasm-message" style="font-size:1.2rem; min-height:2.5em;"></div>
  <button id="start-countdown-btn">開始倒數</button>
  <button id="finish-btn" class="hidden">我射了 / 沒射到</button>
</div>

<!-- 結束畫面 -->
<div id="end-screen" class="screen hidden">
  <h1 id="end-title"></h1>
  <p id="end-desc"></p>
  <button onclick="location.reload()">重新開始</button>
</div>

<script>
  // ===================== 狀態 =====================
  let minDays = 10;
  let maxDays = 20;
  let secretDay = 0;          // 真正的射精日
  let currentDay = 1;
  let fakeDays = [];          // 本局會出現的假射精日（最多2個）
  let photos = [];            // 使用者上傳的照片 (objectURL)
  let isFakeToday = false;
  let teaseProb = 0.8;        // 戲弄機率
  let countdownInterval = null;
  let remaining = 100;

  // ===================== DOM =====================
  const setupScreen = document.getElementById('setup-screen');
  const dayScreen = document.getElementById('day-screen');
  const orgasmScreen = document.getElementById('orgasm-screen');
  const endScreen = document.getElementById('end-screen');
  const dayDisplay = document.getElementById('day-display');
  const message = document.getElementById('message');
  const status = document.getElementById('status');
  const countdownEl = document.getElementById('countdown');
  const orgasmTitle = document.getElementById('orgasm-title');
  const orgasmMessage = document.getElementById('orgasm-message');
  const startCountdownBtn = document.getElementById('start-countdown-btn');
  const finishBtn = document.getElementById('finish-btn');

  // ===================== 初始化 =====================
  document.getElementById('photo-upload').addEventListener('change', (e) => {
    photos = [];
    Array.from(e.target.files).forEach(file => {
      photos.push(URL.createObjectURL(file));
    });
  });

  document.getElementById('start-btn').addEventListener('click', startChallenge);
  document.getElementById('next-day-btn').addEventListener('click', nextDay);
  startCountdownBtn.addEventListener('click', startCountdown);
  finishBtn.addEventListener('click', askResult);

  // ===================== 開始挑戰 =====================
  function startChallenge() {
    minDays = parseInt(document.getElementById('min-days').value) || 10;
    maxDays = parseInt(document.getElementById('max-days').value) || 20;
    if (minDays > maxDays) [minDays, maxDays] = [maxDays, minDays];
    if (minDays < 3) minDays = 3;

    // 隨機真正射精日
    secretDay = Math.floor(Math.random() * (maxDays - minDays + 1)) + minDays;

    // 決定 0～2 個假射精日（只能出現在 minDays 以上，且小於 secretDay）
    fakeDays = [];
    const possibleFakes = [];
    for (let d = minDays; d < secretDay; d++) possibleFakes.push(d);
    const fakeCount = Math.min(2, possibleFakes.length, Math.floor(Math.random() * 3)); // 0~2
    for (let i = 0; i < fakeCount; i++) {
      if (possibleFakes.length === 0) break;
      const idx = Math.floor(Math.random() * possibleFakes.length);
      fakeDays.push(possibleFakes.splice(idx, 1)[0]);
    }

    currentDay = 1;
    setupScreen.classList.add('hidden');
    dayScreen.classList.remove('hidden');
    updateDayView();
  }

  // ===================== 更新每日畫面 =====================
  function updateDayView() {
    dayDisplay.textContent = `第 ${currentDay} 天`;
    isFakeToday = fakeDays.includes(currentDay);

    // 清除背景
    document.body.style.backgroundImage = '';

    if (currentDay === secretDay) {
      // 真正射精日
      message.innerHTML = `<span class="success">恭喜你堅持到了這天</span><br>準備好射精了嗎？`;
      document.getElementById('next-day-btn').classList.add('hidden');
      // 顯示開始按鈕（透過切換畫面）
      setTimeout(() => {
        dayScreen.classList.add('hidden');
        showOrgasmScreen(false); // false = 真實
      }, 1500);
    } else if (isFakeToday) {
      // 假射精日
      message.innerHTML = `<span class="success">恭喜你堅持到了這天</span><br>準備好射精了嗎？`;
      document.getElementById('next-day-btn').classList.add('hidden');
      setTimeout(() => {
        dayScreen.classList.add('hidden');
        showOrgasmScreen(true); // true = 假的
      }, 1500);
    } else {
      // 普通禁止日
      message.textContent = '今天不准射精';
      document.getElementById('next-day-btn').classList.remove('hidden');
    }

    status.textContent = `已堅持 ${currentDay} 天`;
  }

  // ===================== 下一天 =====================
  function nextDay() {
    currentDay++;
    updateDayView();
  }

  // ===================== 顯示射精/假射精畫面 =====================
  function showOrgasmScreen(isFake) {
    isFakeToday = isFake;
    orgasmScreen.classList.remove('hidden');
    countdownEl.style.display = 'none';
    startCountdownBtn.classList.remove('hidden');
    finishBtn.classList.add('hidden');
    remaining = 100;
    teaseProb = 0.8;

    // 設定背景
    if (photos.length > 0) {
      const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
      document.body.style.backgroundImage = `url(${randomPhoto})`;
    }

    if (isFake) {
      orgasmTitle.textContent = '恭喜你堅持到了這天';
      orgasmMessage.textContent = '按下開始後將進入 100 秒倒數，結束後請在 5 秒內射精';
    } else {
      orgasmTitle.textContent = '真正的射精日到了';
      orgasmMessage.textContent = '按下開始後將進入 100 秒倒數，結束後請在 5 秒內射精';
    }
  }

  // ===================== 開始 100 秒倒數 =====================
  function startCountdown() {
    startCountdownBtn.classList.add('hidden');
    countdownEl.style.display = 'block';
    countdownEl.textContent = remaining;
    orgasmMessage.textContent = '跟著倒數…準備射精';

    countdownInterval = setInterval(() => {
      // 戲弄機制：剩餘 ≤3 秒時有機率加 20 秒
      if (remaining <= 3 && remaining > 0 && Math.random() < teaseProb) {
        remaining += 20;
        teaseProb *= 0.8; // 機率乘上 0.8
        orgasmMessage.textContent = '戲弄你的！再加 20 秒！';
        countdownEl.style.color = '#ffaa00';
        setTimeout(() => countdownEl.style.color = '#ff4d6d', 800);
      } else {
        remaining--;
      }

      countdownEl.textContent = remaining;

      if (remaining <= 0) {
        clearInterval(countdownInterval);
        onCountdownEnd();
      }
    }, 1000);
  }

  // ===================== 倒數結束 =====================
  function onCountdownEnd() {
    if (isFakeToday) {
      // 假射精日
      countdownEl.style.display = 'none';
      orgasmTitle.textContent = '';
      orgasmMessage.innerHTML = `<span class="fail" style="font-size:1.6rem;">其實今天不能射喔</span><br><br>繼續忍耐吧`;
      setTimeout(() => {
        orgasmScreen.classList.add('hidden');
        dayScreen.classList.remove('hidden');
        document.body.style.backgroundImage = '';
        // 把假日標記移除，避免重複
        fakeDays = fakeDays.filter(d => d !== currentDay);
        document.getElementById('next-day-btn').classList.remove('hidden');
        message.textContent = '今天不准射精（剛剛是假的）';
      }, 3500);
    } else {
      // 真正射精日 → 給 5 秒射精窗口
      countdownEl.textContent = '射！';
      countdownEl.style.color = '#ff0000';
      orgasmMessage.textContent = '請在 5 秒內射出來！';
      
      let windowTime = 5;
      const windowInt = setInterval(() => {
        windowTime--;
        if (windowTime <= 0) {
          clearInterval(windowInt);
          orgasmMessage.textContent = '時間到。你射到了嗎？';
          finishBtn.classList.remove('hidden');
          finishBtn.textContent = '我成功射精了';
          // 再加一個失敗按鈕
          const failBtn = document.createElement('button');
          failBtn.textContent = '我沒射到 / 失敗了';
          failBtn.className = 'secondary';
          failBtn.style.marginLeft = '12px';
          failBtn.onclick = () => failOrgasm();
          finishBtn.parentNode.appendChild(failBtn);
        }
      }, 1000);
    }
  }

  // ===================== 成功 / 失敗 =====================
  function askResult() {
    // 成功
    orgasmScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');
    document.getElementById('end-title').textContent = '挑戰成功！';
    document.getElementById('end-title').className = 'success';
    document.getElementById('end-desc').textContent = `你總共堅持了 ${currentDay} 天，並成功在射精日射精。恭喜你完成挑戰。`;
  }

  function failOrgasm() {
    // 失敗 → 從第一天重新開始
    alert('射精失敗…挑戰將從第 1 天重新開始。');
    currentDay = 1;
    // 重新抽秘密日與假日（可選擇保留原本或重抽，這裡選擇重抽增加變化）
    secretDay = Math.floor(Math.random() * (maxDays - minDays + 1)) + minDays;
    fakeDays = [];
    const possibleFakes = [];
    for (let d = minDays; d < secretDay; d++) possibleFakes.push(d);
    const fakeCount = Math.min(2, possibleFakes.length, Math.floor(Math.random() * 3));
    for (let i = 0; i < fakeCount; i++) {
      if (possibleFakes.length === 0) break;
      const idx = Math.floor(Math.random() * possibleFakes.length);
      fakeDays.push(possibleFakes.splice(idx, 1)[0]);
    }

    orgasmScreen.classList.add('hidden');
    dayScreen.classList.remove('hidden');
    document.body.style.backgroundImage = '';
    updateDayView();
  }
</script>
</body>
</html>
