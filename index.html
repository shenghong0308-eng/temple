<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長期堅持挑戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: #0d0d0d;
            color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Container with Photo & Overlay */
        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
            transition: background-image 0.5s ease-in-out;
        }

        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #333;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            margin: 16px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ff3333;
            letter-spacing: 1px;
        }

        p {
            color: #b0b0b0;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #d0d0d0;
        }

        input[type="number"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #ff3333;
        }

        .photo-upload-container {
            border: 2px dashed #444;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            margin-bottom: 12px;
        }

        .photo-upload-container:hover {
            border-color: #ff3333;
        }

        .photo-previews {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
        }

        .photo-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #555;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #ff3333;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(255, 51, 51, 0.4);
            margin-top: 10px;
        }

        .btn:hover {
            background: #e60000;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #2a2a2a;
            box-shadow: none;
            color: #ccc;
        }
        .btn-secondary:hover {
            background: #3a3a3a;
            color: #fff;
        }

        /* Daily Screen */
        .day-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #fff;
            margin: 20px 0 10px 0;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.3);
        }

        .day-status {
            font-size: 1.2rem;
            color: #ff4d4d;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Countdown Screen */
        .countdown-timer {
            font-size: 5rem;
            font-weight: 900;
            color: #ff3333;
            margin: 30px 0;
            font-family: monospace;
            text-shadow: 0 0 30px rgba(255, 51, 51, 0.5);
        }

        .alert-toast {
            background: rgba(255, 51, 51, 0.2);
            border: 1px solid #ff3333;
            color: #ff8080;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Modal Overlay for Success Window */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 1.5rem;
            color: #ff3333;
            margin-bottom: 15px;
        }

        .modal-timer {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-buttons .btn {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div id="bg-container"></div>
    <div id="bg-overlay"></div>

    <!-- Setup Screen -->
    <div id="setup-screen" class="container">
        <h1>長期堅持挑戰</h1>
        <p>設定你的天數區間與照片，考驗你的意志力與自我控制。</p>
        
        <div class="form-group">
            <label for="min-days">最小天數</label>
            <input type="number" id="min-days" value="10" min="1" max="365">
        </div>

        <div class="form-group">
            <label for="max-days">最大天數</label>
            <input type="number" id="max-days" value="20" min="1" max="365">
        </div>

        <div class="form-group">
            <label>上傳背景照片 (可多張)</label>
            <div class="photo-upload-container" onclick="document.getElementById('photo-input').click()">
                <span>點擊選擇照片檔案</span>
                <input type="file" id="photo-input" accept="image/*" multiple style="display: none;">
            </div>
            <div class="photo-previews" id="photo-previews"></div>
        </div>

        <button class="btn" id="start-btn">開始挑戰</button>
    </div>

    <!-- Daily Screen -->
    <div id="daily-screen" class="container hidden">
        <h1>長期堅持挑戰</h1>
        <div class="day-display" id="day-display">第 1 天</div>
        <div class="day-status" id="day-status">今天必須繼續堅持</div>
        
        <button class="btn" id="next-day-btn">下一天</button>
        <button class="btn btn-secondary" id="restart-setup-btn" style="margin-top: 10px;">放棄並重新開始</button>
    </div>

    <!-- Countdown Screen -->
    <div id="countdown-screen" class="container hidden">
        <h1 id="countdown-title">關鍵時刻</h1>
        <p id="countdown-desc">恭喜你堅持到了這天！請完成最後的意志力考驗。</p>
        
        <div id="toast-container"></div>

        <div class="countdown-timer" id="timer-display">100</div>

        <button class="btn" id="start-countdown-btn">開始倒數</button>
    </div>

    <!-- End Screen (Success) -->
    <div id="end-screen" class="container hidden">
        <h1>挑戰成功</h1>
        <p style="font-size: 1.1rem; margin: 20px 0; color: #fff;">你展現了無比的毅力與自我控制，成功完成了挑戰！</p>
        <button class="btn" id="end-restart-btn">重新開始新挑戰</button>
    </div>

    <!-- Success Window Modal (Real Completion Day 5-sec window) -->
    <div id="success-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-title">完成！</div>
            <p>是否成功達成目標？</p>
            <div class="modal-timer" id="modal-timer">5</div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="fail-btn">失敗 (重來)</button>
                <button class="btn" id="success-btn">成功 (達成)</button>
            </div>
        </div>
    </div>

    <script>
        // State Variables
        let minDays = 10;
        let maxDays = 20;
        let secretDay = 0;
        let currentDay = 1;
        let fakeDays = [];
        let photos = [];
        let isStarted = false;
        let currentScreen = 'daily'; // 'daily', 'countdown', 'end', 'setup'
        let subState = 'normal';

        // Countdown variables
        let countdownTimerId = null;
        let remainingSeconds = 100;
        let delayProb = 0.8;
        let modalTimerId = null;
        let modalRemaining = 5;

        // DOM Elements
        const bgContainer = document.getElementById('bg-container');
        const setupScreen = document.getElementById('setup-screen');
        const dailyScreen = document.getElementById('daily-screen');
        const countdownScreen = document.getElementById('countdown-screen');
        const endScreen = document.getElementById('end-screen');
        const successModal = document.getElementById('success-modal');

        const minDaysInput = document.getElementById('min-days');
        const maxDaysInput = document.getElementById('max-days');
        const photoInput = document.getElementById('photo-input');
        const photoPreviews = document.getElementById('photo-previews');
        const startBtn = document.getElementById('start-btn');

        const dayDisplay = document.getElementById('day-display');
        const dayStatus = document.getElementById('day-status');
        const nextDayBtn = document.getElementById('next-day-btn');
        const restartSetupBtn = document.getElementById('restart-setup-btn');

        const countdownTitle = document.getElementById('countdown-title');
        const countdownDesc = document.getElementById('countdown-desc');
        const toastContainer = document.getElementById('toast-container');
        const timerDisplay = document.getElementById('timer-display');
        const startCountdownBtn = document.getElementById('start-countdown-btn');

        const endRestartBtn = document.getElementById('end-restart-btn');
        const modalTimer = document.getElementById('modal-timer');
        const successBtn = document.getElementById('success-btn');
        const failBtn = document.getElementById('fail-btn');

        const STORAGE_KEY = 'long_term_challenge_state_v1';

        // Load state on startup
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderPreviews();
            renderScreen();
        });

        // Photo Upload Handling
        photoInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files) return;
            for (let file of files) {
                try {
                    const base64 = await fileToBase64(file);
                    photos.push(base64);
                } catch (err) {
                    console.error(err);
                }
            }
            renderPreviews();
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function renderPreviews() {
            photoPreviews.innerHTML = '';
            photos.forEach((photo) => {
                const img = document.createElement('img');
                img.src = photo;
                img.className = 'photo-thumb';
                photoPreviews.appendChild(img);
            });
        }

        // Start Challenge
        startBtn.addEventListener('click', () => {
            const min = parseInt(minDaysInput.value);
            const max = parseInt(maxDaysInput.value);

            if (isNaN(min) || isNaN(max) || min < 1 || max < min) {
                alert('請輸入有效的天數範圍（最小天數需大於 0 且小於等於最大天數）');
                return;
            }

            minDays = min;
            maxDays = max;
            currentDay = 1;
            isStarted = true;
            currentScreen = 'daily';
            subState = 'normal';

            // Generate secret completion day
            secretDay = Math.floor(Math.random() * (maxDays - minDays + 1)) + minDays;

            // Generate fake completion days (at most 2, > minDays, < secretDay)
            fakeDays = [];
            if (secretDay > minDays + 1) {
                let pool = [];
                for (let d = minDays + 1; d < secretDay; d++) {
                    pool.push(d);
                }
                let maxFake = Math.min(2, pool.length);
                if (maxFake > 0) {
                    let numFake = Math.floor(Math.random() * (maxFake + 1));
                    pool.sort(() => Math.random() - 0.5);
                    fakeDays = pool.slice(0, numFake).sort((a, b) => a - b);
                }
            }

            delayProb = 0.8;
            saveState();
            renderScreen();
        });

        // Next Day Button
        nextDayBtn.addEventListener('click', () => {
            currentDay++;
            delayProb = 0.8;
            saveState();
            renderScreen();
        });

        // Restart Setup Buttons
        restartSetupBtn.addEventListener('click', () => {
            if (confirm('確定要放棄目前進度並重新開始嗎？')) {
                clearState();
                renderPreviews();
                renderScreen();
            }
        });

        endRestartBtn.addEventListener('click', () => {
            clearState();
            renderPreviews();
            renderScreen();
        });

        // Start Countdown Button
        startCountdownBtn.addEventListener('click', () => {
            startCountdownBtn.classList.add('hidden');
            subState = 'running';
            remainingSeconds = 100;
            delayProb = 0.8;
            toastContainer.innerHTML = '';
            timerDisplay.textContent = remainingSeconds;

            if (countdownTimerId) clearInterval(countdownTimerId);

            countdownTimerId = setInterval(() => {
                remainingSeconds--;
                timerDisplay.textContent = remainingSeconds;

                // Check delay mechanism when remaining <= 3 seconds
                if (remainingSeconds <= 3) {
                    if (Math.random() < delayProb) {
                        remainingSeconds += 20;
                        delayProb *= 0.8;
                        showToast(`⚠️ 觸發意志力考驗！倒數增加 20 秒 (目前機率: ${Math.round(delayProb * 100)}%)`);
                        timerDisplay.textContent = remainingSeconds;
                    }
                }

                if (remainingSeconds <= 0) {
                    clearInterval(countdownTimerId);
                    handleCountdownZero();
                }
            }, 1000);
        });

        function showToast(msg) {
            toastContainer.innerHTML = `<div class="alert-toast">${msg}</div>`;
        }

        function handleCountdownZero() {
            if (fakeDays.includes(currentDay)) {
                timerDisplay.textContent = '0';
                showToast('其實今天還不能完成喔');
                setTimeout(() => {
                    toastContainer.innerHTML = '';
                    currentScreen = 'daily';
                    subState = 'normal';
                    saveState();
                    renderScreen();
                }, 3000);
            } else if (currentDay === secretDay) {
                timerDisplay.textContent = '完成！';
                openSuccessModal();
            }
        }

        // Success Modal Handling (5-second window)
        function openSuccessModal() {
            successModal.classList.remove('hidden');
            modalRemaining = 5;
            modalTimer.textContent = modalRemaining;

            if (modalTimerId) clearInterval(modalTimerId);

            modalTimerId = setInterval(() => {
                modalRemaining--;
                modalTimer.textContent = modalRemaining;

                if (modalRemaining <= 0) {
                    clearInterval(modalTimerId);
                    closeSuccessModal();
                    handleFailure();
                }
            }, 1000);
        }

        function closeSuccessModal() {
            successModal.classList.add('hidden');
            if (modalTimerId) clearInterval(modalTimerId);
        }

        successBtn.addEventListener('click', () => {
            closeSuccessModal();
            currentScreen = 'success';
            clearStateKeepSuccess();
            renderScreen();
        });

        failBtn.addEventListener('click', () => {
            closeSuccessModal();
            handleFailure();
        });

        function handleFailure() {
            alert('挑戰失敗！將從第 1 天重新開始。');
            currentDay = 1;
            secretDay = Math.floor(Math.random() * (maxDays - minDays + 1)) + minDays;
            fakeDays = [];
            if (secretDay > minDays + 1) {
                let pool = [];
                for (let d = minDays + 1; d < secretDay; d++) {
                    pool.push(d);
                }
                let maxFake = Math.min(2, pool.length);
                if (maxFake > 0) {
                    let numFake = Math.floor(Math.random() * (maxFake + 1));
                    pool.sort(() => Math.random() - 0.5);
                    fakeDays = pool.slice(0, numFake).sort((a, b) => a - b);
                }
            }
            delayProb = 0.8;
            currentScreen = 'daily';
            subState = 'normal';
            saveState();
            renderScreen();
        }

        function clearStateKeepSuccess() {
            localStorage.removeItem(STORAGE_KEY);
            isStarted = true;
            currentScreen = 'success';
        }

        // Render Screen Logic
        function renderScreen() {
            setupScreen.classList.add('hidden');
            dailyScreen.classList.add('hidden');
            countdownScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            successModal.classList.add('hidden');

            if (countdownTimerId) {
                clearInterval(countdownTimerId);
                countdownTimerId = null;
            }
            if (modalTimerId) {
                clearInterval(modalTimerId);
                modalTimerId = null;
            }

            if (!isStarted || currentScreen === 'setup') {
                setupScreen.classList.remove('hidden');
                setRandomBackground(false);
                return;
            }

            if (currentScreen === 'success') {
                endScreen.classList.remove('hidden');
                setRandomBackground(true);
                return;
            }

            const isCompletionDay = (currentDay === secretDay || fakeDays.includes(currentDay));

            if (isCompletionDay) {
                currentScreen = 'countdown';
                countdownScreen.classList.remove('hidden');
                startCountdownBtn.classList.remove('hidden');
                toastContainer.innerHTML = '';
                timerDisplay.textContent = '100';
                
                if (currentDay === secretDay) {
                    countdownTitle.textContent = '真正完成日';
                    countdownDesc.textContent = '恭喜你堅持到了這天！請完成最後的意志力考驗。';
                } else {
                    countdownTitle.textContent = '模擬完成日';
                    countdownDesc.textContent = '恭喜你堅持到了這天！請通過考驗。';
                }
                setRandomBackground(true);
            } else {
                currentScreen = 'daily';
                dailyScreen.classList.remove('hidden');
                dayDisplay.textContent = `第 ${currentDay} 天`;
                dayStatus.textContent = '今天必須繼續堅持';
                setRandomBackground(false);
            }
        }

        function setRandomBackground(isSpecial) {
            if (isSpecial && photos && photos.length > 0) {
                const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
                bgContainer.style.backgroundImage = `url(${randomPhoto})`;
            } else {
                bgContainer.style.backgroundImage = 'none';
            }
        }

        // LocalStorage functions
        function saveState() {
            const state = {
                minDays,
                maxDays,
                secretDay,
                currentDay,
                fakeDays,
                photos,
                isStarted,
                delayProb,
                currentScreen
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const state = JSON.parse(saved);
                    minDays = state.minDays || 10;
                    maxDays = state.maxDays || 20;
                    secretDay = state.secretDay || 15;
                    currentDay = state.currentDay || 1;
                    fakeDays = state.fakeDays || [];
                    photos = state.photos || [];
                    isStarted = state.isStarted || false;
                    delayProb = state.delayProb !== undefined ? state.delayProb : 0.8;
                    currentScreen = state.currentScreen || 'daily';

                    minDaysInput.value = minDays;
                    maxDaysInput.value = maxDays;
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function clearState() {
            localStorage.removeItem(STORAGE_KEY);
            isStarted = false;
            currentDay = 1;
            secretDay = 0;
            fakeDays = [];
            photos = [];
            currentScreen = 'setup';
        }
    </script>
</body>
</html>
