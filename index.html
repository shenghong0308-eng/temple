<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>長期堅持挑戰</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#0a0a0a;color:#f2f2f2;font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#bg{position:fixed;inset:0;background:#0a0a0a center/cover no-repeat;z-index:0}
#bg.on::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.65)}
.screen{position:relative;z-index:1;min-height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:20px}
.screen.show{display:flex}
h1{margin:0;font-size:clamp(28px,6vw,44px);color:#e11d2e;letter-spacing:2px}
h2{margin:0;font-size:clamp(22px,5vw,34px)}
.big{font-size:clamp(64px,18vw,140px);font-weight:800;color:#e11d2e;line-height:1;font-variant-numeric:tabular-nums}
p{margin:0;font-size:clamp(16px,3.5vw,22px);line-height:1.6;color:#ddd}
.card{width:100%;max-width:440px;background:rgba(20,20,20,.85);border:1px solid #3a0a0f;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;text-align:left}
label{font-size:15px;color:#bbb;display:flex;flex-direction:column;gap:6px}
input[type=number]{-webkit-user-select:text;user-select:text;background:#111;border:1px solid #444;color:#fff;border-radius:8px;padding:12px;font-size:18px;width:100%}
input[type=number]:focus{outline:none;border-color:#e11d2e}
.row{display:flex;gap:12px}.row label{flex:1}
button,.filebtn{background:#e11d2e;color:#fff;border:0;border-radius:10px;padding:14px 28px;font-size:18px;font-weight:700;cursor:pointer;transition:.15s;text-align:center}
button:hover,.filebtn:hover{background:#ff2b3f}button:active{transform:scale(.97)}
button.ghost,.filebtn{background:transparent;border:1px solid #e11d2e;color:#ff5b69}
button.ghost:hover,.filebtn:hover{background:#2a0a0e}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#thumbs{display:flex;flex-wrap:wrap;gap:6px}
#thumbs img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid #555;-webkit-user-drag:none}
.err{color:#ff5b69;font-size:14px;min-height:18px}
.small{font-size:14px;color:#888}
</style>
</head>
<body>
<div id="bg"></div>

<!-- 設定 -->
<section class="screen" id="s-setup">
  <h1>長期堅持挑戰</h1>
  <div class="card">
    <div class="row">
      <label>最小天數<input type="number" id="min" value="10" min="1"></label>
      <label>最大天數<input type="number" id="max" value="20" min="1"></label>
    </div>
    <label>背景照片（可多選，完成日時隨機顯示）
      <span class="filebtn" id="pickBtn">選擇照片</span>
      <input type="file" id="files" accept="image/*" multiple hidden>
    </label>
    <div id="thumbs"></div>
    <div class="err" id="err"></div>
    <button id="start">開始挑戰</button>
  </div>
</section>

<!-- 日常 -->
<section class="screen" id="s-day">
  <p>挑戰進行中</p>
  <h2>第</h2>
  <div class="big" id="dayNum">1</div>
  <h2>天</h2>
  <p id="dayMsg">今天必須繼續堅持</p>
  <button id="next">下一天</button>
</section>

<!-- 完成日 / 模擬完成日 -->
<section class="screen" id="s-done">
  <p>第 <span id="doneDay"></span> 天</p>
  <h2>恭喜你堅持到了這天</h2>
  <button id="cdStart">開始倒數</button>
</section>

<section class="screen" id="s-count">
  <p>倒數中</p>
  <div class="big" id="cdNum">100</div>
</section>

<section class="screen" id="s-fake">
  <h2>其實今天還不能完成喔</h2>
  <p>繼續堅持下去……</p>
</section>

<section class="screen" id="s-win">
  <h1>完成！</h1>
  <div class="big" id="winNum">5</div>
</section>

<section class="screen" id="s-ask">
  <h2>你是否成功達成？</h2>
  <div class="btns">
    <button id="yes">成功</button>
    <button class="ghost" id="no">失敗</button>
  </div>
</section>

<section class="screen" id="s-end">
  <h1>挑戰成功</h1>
  <p>你完成了長期堅持挑戰，意志力無人能擋。</p>
  <button id="restart">重新開始</button>
</section>

<script>
(function(){
  var KEY = 'longChallengeState_v1';
  var $ = function(id){ return document.getElementById(id); };
  var screens = ['setup','day','done','count','fake','win','ask','end'];
  var state = null;           // 持久化資料
  var photos = [];            // 設定畫面暫存照片
  var timer = null;           // 目前計時器
  var currentBg = null;

  function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

  function show(name){
    screens.forEach(function(s){ $('s-'+s).classList.toggle('show', s===name); });
    var useBg = ['done','count','fake','win','ask'].indexOf(name) >= 0 && currentBg;
    var bg = $('bg');
    bg.classList.toggle('on', !!useBg);
    bg.style.backgroundImage = useBg ? 'url("'+currentBg+'")' : 'none';
  }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){
      // 容量不足時，嘗試不含照片保存進度
      try { var c = Object.assign({}, state, {photos: []}); localStorage.setItem(KEY, JSON.stringify(c)); } catch(e2){}
    }
  }
  function load(){
    try { var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; }
  }
  function clearSave(){ try { localStorage.removeItem(KEY); } catch(e){} }

  function stopTimer(){ if(timer){ clearInterval(timer); clearTimeout(timer); timer = null; } }

  function plan(min,max){
    var secret = rnd(min,max);
    var cands = [];
    for(var d=min+1; d<secret; d++) cands.push(d);
    var n = Math.min(rnd(0,2), cands.length), fakes = [];
    while(n-- > 0){
      var i = rnd(0,cands.length-1);
      fakes.push(cands.splice(i,1)[0]);
    }
    fakes.sort(function(a,b){return a-b;});
    return {secret:secret, fakes:fakes};
  }

  function pickBg(){
    var p = state && state.photos || [];
    currentBg = p.length ? p[rnd(0,p.length-1)] : null;
  }

  // ---------- 設定 ----------
  $('pickBtn').onclick = function(){ $('files').click(); };
  $('files').onchange = function(e){
    var list = Array.prototype.slice.call(e.target.files);
    list.forEach(function(f){
      var fr = new FileReader();
      fr.onload = function(){
        var img = new Image();
        img.onload = function(){
          var max = 1280, w = img.width, h = img.height, s = Math.min(1, max/Math.max(w,h));
          var c = document.createElement('canvas');
          c.width = Math.round(w*s); c.height = Math.round(h*s);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          photos.push(c.toDataURL('image/jpeg',0.75));
          renderThumbs();
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(f);
    });
    e.target.value = '';
  };
  function renderThumbs(){
    $('thumbs').innerHTML = '';
    photos.forEach(function(src,i){
      var im = document.createElement('img');
      im.src = src; im.title = '點擊移除';
      im.onclick = function(){ photos.splice(i,1); renderThumbs(); };
      $('thumbs').appendChild(im);
    });
  }

  $('start').onclick = function(){
    var min = parseInt($('min').value,10), max = parseInt($('max').value,10);
    if(!(min>=1) || !(max>=1)){ $('err').textContent = '請輸入有效的天數（至少 1 天）'; return; }
    if(min>max){ $('err').textContent = '最小天數不可大於最大天數'; return; }
    $('err').textContent = '';
    var p = plan(min,max);
    state = {min:min, max:max, secret:p.secret, day:1, fakes:p.fakes, photos:photos.slice(), started:true};
    save();
    enterDay();
  };

  // ---------- 每日 ----------
  function isReal(){ return state.day === state.secret; }
  function isFake(){ return state.fakes.indexOf(state.day) >= 0; }

  function enterDay(){
    stopTimer();
    if(isReal() || isFake()){
      pickBg();
      $('doneDay').textContent = state.day;
      show('done');
    } else {
      currentBg = null;
      $('dayNum').textContent = state.day;
      show('day');
    }
  }
  $('next').onclick = function(){
    state.day++;
    save();
    enterDay();
  };

  // ---------- 倒數 ----------
  $('cdStart').onclick = function(){
    var remain = 100, prob = 0.8;
    $('cdNum').textContent = remain;
    show('count');
    stopTimer();
    timer = setInterval(function(){
      remain--;
      if(remain === 3){
        if(Math.random() < prob){
          remain += 20;
          prob *= 0.8;
        }
      }
      $('cdNum').textContent = Math.max(remain,0);
      if(remain <= 0){
        stopTimer();
        finishCountdown();
      }
    }, 1000);
  };

  function finishCountdown(){
    if(isReal()){
      var t = 5;
      $('winNum').textContent = t;
      show('win');
      timer = setInterval(function(){
        t--;
        $('winNum').textContent = Math.max(t,0);
        if(t <= 0){ stopTimer(); show('ask'); }
      }, 1000);
    } else {
      show('fake');
      timer = setTimeout(function(){
        timer = null;
        // 這個模擬完成日已結束，移除後回到日常畫面
        state.fakes = state.fakes.filter(function(d){ return d !== state.day; });
        save();
        currentBg = null;
        $('dayNum').textContent = state.day;
        show('day');
      }, 4000);
    }
  }

  // ---------- 結果 ----------
  $('yes').onclick = function(){
    stopTimer();
    clearSave();
    state = null;
    currentBg = null;
    show('end');
  };
  $('no').onclick = function(){
    var p = plan(state.min, state.max);
    state.secret = p.secret; state.fakes = p.fakes; state.day = 1;
    save();
    enterDay();
  };
  $('restart').onclick = function(){
    stopTimer();
    clearSave();
    state = null; photos = []; currentBg = null;
    renderThumbs();
    show('setup');
  };

  // ---------- 啟動：恢復進度 ----------
  var saved = load();
  if(saved && saved.started){
    state = saved;
    state.photos = state.photos || [];
    state.fakes = state.fakes || [];
    $('min').value = state.min; $('max').value = state.max;
    enterDay();
  } else {
    show('setup');
  }

  // 禁止文字選取與右鍵
  document.addEventListener('selectstart', function(e){
    if(!(e.target && e.target.tagName === 'INPUT')) e.preventDefault();
  });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
