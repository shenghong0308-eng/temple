<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長期挑戰任務系統</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #bb86fc;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --danger: #cf6679;
            --success: #03dac6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }
        h1, h2, h3 { text-align: center; color: var(--primary); }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .streak-display { font-size: 24px; text-align: center; font-weight: bold; color: var(--success); }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
        button.secondary { background: #333; color: var(--text); }
        button.danger { background: var(--danger); color: #000; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; color: var(--text-secondary); }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .task-item {
            border-bottom: 1px solid #333;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-info { flex: 1; }
        .task-actions { display: flex; gap: 5px; }
        .task-actions button { width: auto; padding: 6px 10px; font-size: 12px; margin: 0;}
    </style>
</head>
<body>

<div class="container">

    <div id="main-view" class="view active">
        <h1>挑戰主頁</h1>
        <div class="card">
            <div class="streak-display">持續堅持：<span id="streak-count">0</span> 天</div>
        </div>
        
        <div class="card">
            <h3>目前抽到的任務</h3>
            <div id="drawn-task-container" style="text-align: center; min-height: 60px; font-size: 18px; font-weight: bold;">
                尚未抽取任務
            </div>
            <div id="drawn-task-detail" style="text-align: center; color: var(--text-secondary); font-size: 14px; margin-top: 5px;"></div>
        </div>

        <button id="btn-draw" onclick="drawTask()">🎲 抽取任務</button>
        <button class="secondary" onclick="switchView('pool-view')">📂 進入任務庫</button>
        <button class="secondary" onclick="nextDay()">☀️ 過了一天 (模擬堅持)</button>
        <button class="danger" onclick="failChallenge()">💥 宣告挑戰失敗</button>
    </div>

    <div id="pool-view" class="view">
        <h1>任務庫管理</h1>
        <button class="secondary" onclick="switchView('main-view')">⬅️ 返回主頁</button>
        
        <div class="card" style="margin-top: 15px;">
            <h3 id="form-title">添加新任務</h3>
            <input type="hidden" id="task-id">
            <div class="form-group">
                <label>任務名稱</label>
                <input type="text" id="task-name" placeholder="例如：跑步 3 公里">
            </div>
            <div class="form-group">
                <label>初始權重 (數字，越高越容易被抽到)</label>
                <input type="number" id="task-init-weight" value="10">
            </div>
            <div class="form-group">
                <label>任務加權模式</label>
                <select id="task-weight-mode">
                    <option value="constant">恆等於初始權重</option>
                    <option value="linear_add">等於初始權重 + 堅持天數</option>
                    <option value="exp_add">等於初始權重 * 1.2 的堅持天數次方</option>
                    <option value="linear_sub">等於初始權重 - 堅持天數</option>
                    <option value="exp_sub">等於初始權重 / (1.2 的堅持天數次方)</option>
                </select>
            </div>
            <div class="form-group">
                <label>任務重置加權條件</label>
                <select id="task-reset-condition" onchange="toggleResetParam()">
                    <option value="none">不重置</option>
                    <option value="draw_n">抽到 n 次時重置</option>
                </select>
            </div>
            <div class="form-group" id="reset-param-group" style="display: none;">
                <label>次數 n</label>
                <input type="number" id="task-reset-param" value="3">
            </div>
            <div class="form-group">
                <label>任務詳細內容</label>
                <textarea id="task-content" rows="3" placeholder="請輸入詳細內容..."></textarea>
            </div>
            <button id="btn-save-task" onclick="saveTask()">💾 儲存任務</button>
            <button id="btn-cancel-edit" class="secondary" style="display:none;" onclick="resetForm()">取消編輯</button>
        </div>

        <div class="card">
            <h3>目前任務列表</h3>
            <div id="task-list"></div>
        </div>
    </div>

</div>

<script>
    // 遊戲狀態資料結構
    let state = {
        streak: 0,
        currentTask: null,
        tasks: []
    };

    // 初始化讀取 LocalStorage
    function init() {
        const savedState = localStorage.getItem('challenge_state');
        if (savedState) {
            state = JSON.parse(savedState);
        }
        renderMain();
        renderPool();
    }

    function saveState() {
        localStorage.setItem('challenge_state', JSON.stringify(state));
    }

    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if(viewId === 'pool-view') renderPool();
        if(viewId === 'main-view') renderMain();
    }

    function toggleResetParam() {
        const cond = document.getElementById('task-reset-condition').value;
        document.getElementById('reset-param-group').style.display = (cond === 'draw_n') ? 'block' : 'none';
    }

    // 核心邏輯 1：動態計算某條任務當前的權重
    function calculateCurrentWeight(task) {
        let d = task.taskStreak || 0; // 該任務獨立計算的堅持天數
        let w0 = parseFloat(task.initWeight) || 1;
        let w = w0;

        switch(task.weightMode) {
            case 'linear_add': w = w0 + d; break;
            case 'exp_add': w = w0 * Math.pow(1.2, d); break;
            case 'linear_sub': w = w0 - d; break;
            case 'exp_sub': w = w0 / Math.pow(1.2, d); break;
            default: w = w0; // constant
        }
        return Math.max(0, w); // 權重不為負數
    }

    // 核心邏輯 2：加權隨機抽取演算法
    function drawTask() {
        if (state.tasks.length === 0) {
            alert("任務庫空空如也，請先去任務庫添加任務！");
            return;
        }

        // 計算總權重
        let totalWeight = 0;
        let activeTasks = state.tasks.map(t => {
            let w = calculateCurrentWeight(t);
            totalWeight += w;
            return { task: t, currentWeight: w };
        });

        if (totalWeight <= 0) {
            alert("所有任務當前權重皆為 0，無法抽取！");
            return;
        }

        // 隨機落點
        let randomNum = Math.random() * totalWeight;
        let sum = 0;
        let selected = null;

        for (let item of activeTasks) {
            sum += item.currentWeight;
            if (randomNum <= sum) {
                selected = item.task;
                break;
            }
        }

        if (selected) {
            // 更新抽取數據
            selected.drawCount = (selected.drawCount || 0) + 1;
            state.currentTask = { name: selected.name, content: selected.content };

            // 檢查是否觸發「重置加權條件」
            if (selected.resetCondition === 'draw_n' && selected.drawCount >= parseInt(selected.resetParam)) {
                selected.taskStreak = 0; // 重置該任務的獨立堅持天數
                selected.drawCount = 0;  // 重置抽取次數計數
            }
            
            saveState();
            renderMain();
        }
    }

    // 核心邏輯 3：過了一天（增加堅持天數）
    function nextDay() {
        state.streak++;
        // 每一條任務的獨立堅持天數也 +1
        state.tasks.forEach(t => {
            t.taskStreak = (t.taskStreak || 0) + 1;
        });
        saveState();
        renderMain();
    }

    // 核心邏輯 4：挑戰失敗重置
    function failChallenge() {
        if(confirm("確定宣告挑戰失敗嗎？這會將天數與任務加權歸零喔！")) {
            state.streak = 0;
            state.currentTask = null;
            // 任務庫不刪除，但所有任務的加權數據歸零（獨立天數與抽取次數歸零）
            state.tasks.forEach(t => {
                t.taskStreak = 0;
                t.drawCount = 0;
            });
            saveState();
            renderMain();
            alert("挑戰已重置，加油！重新開始！");
        }
    }

    // 主頁畫面渲染
    function renderMain() {
        document.getElementById('streak-count').innerText = state.streak;
        const container = document.getElementById('drawn-task-container');
        const detail = document.getElementById('drawn-task-detail');
        
        if (state.currentTask) {
            container.innerText = state.currentTask.name;
            detail.innerText = state.currentTask.content || "無詳細內容";
        } else {
            container.innerText = "尚未抽取任務";
            detail.innerText = "";
        }
    }

    // 任務庫畫面渲染 (CRUD)
    function renderPool() {
        const listContainer = document.getElementById('task-list');
        listContainer.innerHTML = '';

        state.tasks.forEach((t, index) => {
            let curW = calculateCurrentWeight(t).toFixed(1);
            let item = document.createElement('div');
            item.className = 'task-item';
            item.innerHTML = `
                <div class="task-info">
                    <strong>${t.name}</strong> <span style="font-size:12px; color:var(--primary);">[當前權重: ${curW}]</span><br>
                    <small style="color:var(--text-secondary)">初始: ${t.initWeight} | 模式: ${t.weightMode} | 獨立天數: ${t.taskStreak || 0} | 已抽: ${t.drawCount || 0}次</small>
                </div>
                <div class="task-actions">
                    <button class="secondary" onclick="editTask('${t.id}')">✏️</button>
                    <button class="danger" onclick="deleteTask('${t.id}')">🗑️</button>
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    // 儲存任務 (包含新增與修改)
    function saveTask() {
        const id = document.getElementById('task-id').value;
        const name = document.getElementById('task-name').value.trim();
        const initWeight = parseFloat(document.getElementById('task-init-weight').value) || 10;
        const weightMode = document.getElementById('task-weight-mode').value;
        const resetCondition = document.getElementById('task-reset-condition').value;
        const resetParam = document.getElementById('task-reset-param').value;
        const content = document.getElementById('task-content').value.trim();

        if (!name) {
            alert("請輸入任務名稱！");
            return;
        }

        if (id) {
            // 編輯模式
            let task = state.tasks.find(t => t.id === id);
            if (task) {
                task.name = name;
                task.initWeight = initWeight;
                task.weightMode = weightMode;
                task.resetCondition = resetCondition;
                task.resetParam = resetParam;
                task.content = content;
            }
        } else {
            // 新增模式
            let newTask = {
                id: Date.now().toString(),
                name: name,
                initWeight: initWeight,
                weightMode: weightMode,
                resetCondition: resetCondition,
                resetParam: resetParam,
                content: content,
                taskStreak: 0, // 初始獨立天數為 0
                drawCount: 0   // 初始被抽到次數為 0
            };
            state.tasks.push(newTask);
        }

        saveState();
        resetForm();
        renderPool();
    }

    function editTask(id) {
        let task = state.tasks.find(t => t.id === id);
        if (!task) return;

        document.getElementById('task-id').value = task.id;
        document.getElementById('task-name').value = task.name;
        document.getElementById('task-init-weight').value = task.initWeight;
        document.getElementById('task-weight-mode').value = task.weightMode;
        document.getElementById('task-reset-condition').value = task.resetCondition;
        document.getElementById('task-reset-param').value = task.resetParam || 3;
        document.getElementById('task-content').value = task.content;

        toggleResetParam();
        document.getElementById('form-title').innerText = "編輯任務";
        document.getElementById('btn-cancel-edit').style.display = "block";
    }

    function deleteTask(id) {
        if(confirm("確定要刪除這個任務嗎？")) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            saveState();
            renderPool();
        }
    }

    function resetForm() {
        document.getElementById('task-id').value = '';
        document.getElementById('task-name').value = '';
        document.getElementById('task-init-weight').value = '10';
        document.getElementById('task-weight-mode').value = 'constant';
        document.getElementById('task-reset-condition').value = 'none';
        document.getElementById('task-reset-param').value = '3';
        document.getElementById('task-content').value = '';
        
        toggleResetParam();
        document.getElementById('form-title').innerText = "添加新任務";
        document.getElementById('btn-cancel-edit').style.display = "none";
    }

    // 啟動載入
    window.onload = init;
</script>
</body>
</html>
