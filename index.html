<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腳本式節拍器 - 計時倒數版</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            color: white;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 950px;
            width: 100%;
        }

        .script-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        textarea {
            width: 100%;
            height: 250px;
            background: #0f3460;
            color: #e94560;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
            line-height: 1.5;
            outline: none;
        }

        .display-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
        }

        .status-badge {
            background: #e94560;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        /* 資訊顯示框 */
        .info-panel {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        .current-info {
            font-size: 1.4rem;
            font-weight: bold;
            color: #4db8ff;
            min-height: 40px;
            margin-bottom: 5px;
        }

        /* 倒數計時器樣式 */
        .timer-display {
            font-size: 2.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #f1c40f;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }

        .next-info {
            font-size: 1rem;
            color: #888;
            min-height: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        .btn-group { margin-bottom: 20px; }

        button {
            font-size: 1.1rem;
            padding: 12px 30px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            transition: all 0.2s;
        }

        .run-btn { background-color: #27ae60; color: white; }
        .stop-btn { background-color: #e74c3c; color: white; }

        /* 動畫區 */
        .stage {
            position: relative;
            height: 160px;
            width: 250px;
            border-bottom: 3px solid #4db8ff;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .ball {
            width: 40px;
            height: 40px;
            background-color: #f1c40f;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
            position: relative;
            opacity: 0;
        }

        .ball.active {
            opacity: 1;
            animation: bounce infinite;
        }

        @keyframes bounce {
            0% { transform: translateY(0); animation-timing-function: ease-out; }
            50% { transform: translateY(-120px); animation-timing-function: ease-in; }
            100% { transform: translateY(0); }
        }

        .ripple {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 40px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #4db8ff;
            opacity: 0;
        }

        @keyframes rippleAnim {
            0% { transform: translateX(-50%) scale(1); opacity: 1; }
            100% { transform: translateX(-50%) scale(3); opacity: 0; }
        }
    </style>
</head>
<body>

    <h2 style="margin-top:0">🎼 腳本式自動化節拍器</h2>

    <div class="container">
        <div class="script-section">
            <label>腳本內容：</label>
            <textarea id="scriptInput">1秒1下，持續5秒
暫停3秒
0.5秒1下，持續5秒
暫停2秒
1秒2下，持續5秒</textarea>
            <p style="font-size: 0.85rem; color: #888;">格式：1秒1下，持續5秒 / 暫停2秒</p>
        </div>

        <div class="display-section">
            <div id="status" class="status-badge" style="visibility: hidden;">運行中</div>
            
            <div class="info-panel">
                <div id="currentInfo" class="current-info">準備就緒</div>
                <div id="timerDisplay" class="timer-display">00.0</div>
                <div id="nextInfo" class="next-info">下一步：--</div>
            </div>

            <div class="btn-group">
                <button id="runBtn" class="run-btn">執行腳本</button>
                <button id="stopBtn" class="stop-btn" style="display:none">停止</button>
            </div>

            <div class="stage">
                <div id="ball" class="ball"></div>
                <div id="ripple" class="ripple"></div>
            </div>
        </div>
    </div>

    <script>
        const scriptInput = document.getElementById('scriptInput');
        const runBtn = document.getElementById('runBtn');
        const stopBtn = document.getElementById('stopBtn');
        const currentInfo = document.getElementById('currentInfo');
        const timerDisplay = document.getElementById('timerDisplay');
        const nextInfo = document.getElementById('nextInfo');
        const statusBadge = document.getElementById('status');
        const ball = document.getElementById('ball');
        const ripple = document.getElementById('ripple');

        let audioCtx = null;
        let isRunning = false;
        let currentDuration = 1.0;
        let topSoundTimer = null;

        // --- 音效與特效 ---
        function playTone(freq, type, vol = 0.5) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function triggerRipple() {
            ripple.style.animation = 'none';
            void ripple.offsetWidth;
            ripple.style.animation = 'rippleAnim 0.4s linear';
        }

        function handleTick() {
            if (!isRunning) return;
            playTone(800, 'triangle');
            triggerRipple();
            if (topSoundTimer) clearTimeout(topSoundTimer);
            topSoundTimer = setTimeout(() => {
                if (isRunning) playTone(600, 'sine');
            }, (currentDuration * 1000) / 2);
        }

        ball.addEventListener('animationiteration', handleTick);

        // --- 格式化指令顯示 ---
        function formatStep(step) {
            if (!step) return "結束";
            if (step.type === 'play') {
                return `▶ ${step.unitSeconds}秒${step.unitTimes}下`;
            } else {
                return `⏸ 暫停中`;
            }
        }

        // --- 解析腳本 ---
        function parseScript(text) {
            const lines = text.split('\n');
            const queue = [];
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                const playMatch = line.match(/([\d.]+)秒([\d.]+)下.*持續([\d.]+)秒/);
                if (playMatch) {
                    queue.push({ type: 'play', unitSeconds: parseFloat(playMatch[1]), unitTimes: parseFloat(playMatch[2]), totalTime: parseFloat(playMatch[3]) });
                } else {
                    const pauseMatch = line.match(/暫停([\d.]+)秒/);
                    if (pauseMatch) queue.push({ type: 'pause', totalTime: parseFloat(pauseMatch[1]) });
                }
            });
            return queue;
        }

        // --- 倒數計時核心邏輯 ---
        async function runCountdown(seconds) {
            let remaining = seconds;
            while (remaining > 0 && isRunning) {
                // 更新畫面顯示，保留一位小數
                timerDisplay.textContent = remaining.toFixed(1);
                
                // 等待 100 毫秒
                await new Promise(r => setTimeout(r, 100));
                remaining -= 0.1;
                
                // 防止浮點數計算產生微小負數
                if (remaining < 0) remaining = 0;
            }
            timerDisplay.textContent = "0.0";
        }

        // --- 執行流程 ---
        async function executeScript() {
            const queue = parseScript(scriptInput.value);
            if (queue.length === 0) return;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isRunning = true;
            runBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            statusBadge.style.visibility = 'visible';

            for (let i = 0; i < queue.length; i++) {
                if (!isRunning) break;
                const step = queue[i];
                const nextStep = queue[i + 1];

                // 更新資訊介面
                currentInfo.innerHTML = formatStep(step);
                nextInfo.textContent = "下一步：" + formatStep(nextStep) + (nextStep ? ` (${nextStep.totalTime}秒)` : "");

                if (step.type === 'play') {
                    currentDuration = step.unitSeconds / step.unitTimes;
                    ball.style.animationDuration = `${currentDuration}s`;
                    ball.classList.add('active');
                    handleTick(); 
                    // 執行倒數計時（這會阻塞迴圈直到倒數結束）
                    await runCountdown(step.totalTime);
                } else {
                    ball.classList.remove('active');
                    // 暫停時同樣執行倒數
                    await runCountdown(step.totalTime);
                }
            }

            stopScript("腳本結束");
        }

        function stopScript(msg = "準備就緒") {
            isRunning = false;
            ball.classList.remove('active');
            if (topSoundTimer) clearTimeout(topSoundTimer);
            currentInfo.textContent = msg;
            nextInfo.textContent = "下一步：--";
            timerDisplay.textContent = "00.0";
            runBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            statusBadge.style.visibility = 'hidden';
        }

        runBtn.addEventListener('click', executeScript);
        stopBtn.addEventListener('click', () => stopScript("手動停止"));

    </script>
</body>
</html>
