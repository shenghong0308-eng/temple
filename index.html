<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>長期禁慾挑戰</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    height: 100%;
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }
  .bg-layer {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: none;
  }
  .bg-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.72);
    z-index: 1;
    display: none;
  }
  .screen {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 24px 20px;
    text-align: center;
    display: none;
  }
  .screen.active { display: block; }
  h1 {
    font-size: 1.8rem;
    color: #ff2a2a;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  h2 {
    font-size: 1.4rem;
    margin-bottom: 16px;
    color: #ff4444;
  }
  .subtitle {
    color: #aaa;
    font-size: 0.95rem;
    margin-bottom: 28px;
  }
  .input-group {
    margin-bottom: 18px;
    text-align: left;
  }
  .input-group label {
    display: block;
    font-size: 0.9rem;
    color: #ccc;
    margin-bottom: 6px;
  }
  .input-row {
    display: flex;
    gap: 12px;
  }
  input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    color: #fff;
    font-size: 1.1rem;
    outline: none;
  }
  input[type="number"]:focus {
    border-color: #ff2a2a;
  }
  input[type="file"] {
    display: none;
  }
  .file-btn {
    display: inline-block;
    padding: 12px 20px;
    background: #1a1a1a;
    border: 1px dashed #555;
    border-radius: 10px;
    color: #ccc;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
    transition: all 0.2s;
  }
  .file-btn:hover, .file-btn:active {
    border-color: #ff2a2a;
    color: #fff;
  }
  .photo-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    justify-content: center;
  }
  .photo-preview img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    font-size: 1.15rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff2a2a, #cc0000);
    color: #fff;
  }
  .btn-primary:active {
    transform: scale(0.97);
    opacity: 0.9;
  }
  .btn-secondary {
    background: #222;
    color: #ddd;
    border: 1px solid #444;
  }
  .btn-secondary:active {
    background: #333;
  }
  .btn-danger {
    background: #330000;
    color: #ff6666;
    border: 1px solid #550000;
  }
  .day-number {
    font-size: 4.5rem;
    font-weight: 800;
    color: #ff2a2a;
    line-height: 1;
    margin: 20px 0 8px;
  }
  .day-label {
    font-size: 1.1rem;
    color: #aaa;
    margin-bottom: 30px;
  }
  .status-text {
    font-size: 1.35rem;
    margin: 24px 0;
    line-height: 1.5;
  }
  .status-text.forbid {
    color: #ff5555;
  }
  .status-text.allow {
    color: #ffcc00;
  }
  .countdown-display {
    font-size: 5.5rem;
    font-weight: 800;
    color: #ff2a2a;
    margin: 30px 0;
    font-variant-numeric: tabular-nums;
  }
  .tease-msg {
    color: #ffaa00;
    font-size: 1.1rem;
    margin-top: 10px;
    min-height: 1.4em;
  }
  .result-msg {
    font-size: 2rem;
    font-weight: 700;
    margin: 30px 0;
  }
  .result-msg.success { color: #00ff88; }
  .result-msg.fail { color: #ff5555; }
  .result-msg.fake { color: #ffaa00; }
  .window-timer {
    font-size: 1.2rem;
    color: #ffcc00;
    margin-bottom: 20px;
  }
  .hidden { display: none !important; }
  .small-note {
    font-size: 0.8rem;
    color: #666;
    margin-top: 20px;
  }
</style>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay" id="bgOverlay"></div>

  <!-- 開始設定畫面 -->
  <div class="screen active" id="setupScreen">
    <h1>長期禁慾挑戰</h1>
    <p class="subtitle">設定挑戰天數區間，系統將秘密抽取射精日</p>
    
    <div class="input-group">
      <label>最小天數</label>
      <input type="number" id="minDays" min="1" max="365" value="10">
    </div>
    <div class="input-group">
      <label>最大天數</label>
      <input type="number" id="maxDays" min="1" max="365" value="20">
    </div>
    
    <div class="input-group">
      <label>上傳背景照片（可多選）</label>
      <label class="file-btn" for="photoInput">選擇照片</label>
      <input type="file" id="photoInput" accept="image/*" multiple>
      <div class="photo-preview" id="photoPreview"></div>
    </div>
    
    <button class="btn btn-primary" id="startBtn">開始挑戰</button>
    <p class="small-note">進度會自動保存，關閉後可繼續</p>
  </div>

  <!-- 每日畫面 -->
  <div class="screen" id="dailyScreen">
    <div class="day-label">目前進度</div>
    <div class="day-number" id="currentDayNum">1</div>
    <div class="day-label">天</div>
    <div class="status-text forbid" id="dailyStatus">今天不准射精</div>
    <button class="btn btn-primary" id="nextDayBtn">下一天</button>
  </div>

  <!-- 射精日 / 假射精日 提示畫面 -->
  <div class="screen" id="climaxIntroScreen">
    <h2>恭喜你堅持到了這天</h2>
    <p class="status-text allow">準備好了嗎？</p>
    <button class="btn btn-primary" id="startCountdownBtn">開始倒數</button>
  </div>

  <!-- 倒數畫面 -->
  <div class="screen" id="countdownScreen">
    <div class="day-label">倒數進行中</div>
    <div class="countdown-display" id="countdownNum">100</div>
    <div class="tease-msg" id="teaseMsg"></div>
  </div>

  <!-- 假射精日結果 -->
  <div class="screen" id="fakeResultScreen">
    <div class="result-msg fake">其實今天不能射喔</div>
    <p class="status-text">繼續堅持吧</p>
  </div>

  <!-- 真正射精日窗口 -->
  <div class="screen" id="realWindowScreen">
    <div class="result-msg success">射！</div>
    <div class="window-timer" id="windowTimer">剩餘 5 秒</div>
    <p class="status-text">把握時間！</p>
  </div>

  <!-- 詢問是否成功 -->
  <div class="screen" id="askSuccessScreen">
    <h2>時間到</h2>
    <p class="status-text">你有成功射精嗎？</p>
    <button class="btn btn-primary" id="successBtn">成功了</button>
    <button class="btn btn-danger" id="failBtn">沒有 / 失敗</button>
  </div>

  <!-- 結束畫面 -->
  <div class="screen" id="endScreen">
    <div class="result-msg success">挑戰成功</div>
    <p class="status-text">恭喜你完成長期禁慾挑戰！</p>
    <button class="btn btn-primary" id="restartBtn">重新開始</button>
  </div>

<script>
(function() {
  const STORAGE_KEY = 'abstinence_challenge_v1';

  // 狀態
  let state = {
    started: false,
    minDays: 10,
    maxDays: 20,
    secretDay: null,
    fakeDays: [],
    currentDay: 1,
    photos: [], // base64 strings
    teaseProbability: 0.8
  };

  // DOM
  const screens = {
    setup: document.getElementById('setupScreen'),
    daily: document.getElementById('dailyScreen'),
    climaxIntro: document.getElementById('climaxIntroScreen'),
    countdown: document.getElementById('countdownScreen'),
    fakeResult: document.getElementById('fakeResultScreen'),
    realWindow: document.getElementById('realWindowScreen'),
    askSuccess: document.getElementById('askSuccessScreen'),
    end: document.getElementById('endScreen')
  };

  const bgLayer = document.getElementById('bgLayer');
  const bgOverlay = document.getElementById('bgOverlay');
  const minDaysInput = document.getElementById('minDays');
  const maxDaysInput = document.getElementById('maxDays');
  const photoInput = document.getElementById('photoInput');
  const photoPreview = document.getElementById('photoPreview');
  const startBtn = document.getElementById('startBtn');
  const currentDayNum = document.getElementById('currentDayNum');
  const dailyStatus = document.getElementById('dailyStatus');
  const nextDayBtn = document.getElementById('nextDayBtn');
  const startCountdownBtn = document.getElementById('startCountdownBtn');
  const countdownNum = document.getElementById('countdownNum');
  const teaseMsg = document.getElementById('teaseMsg');
  const windowTimer = document.getElementById('windowTimer');
  const successBtn = document.getElementById('successBtn');
  const failBtn = document.getElementById('failBtn');
  const restartBtn = document.getElementById('restartBtn');

  let countdownInterval = null;
  let windowInterval = null;
  let isRealClimax = false;

  // ========== localStorage ==========
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('localStorage save failed', e);
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && data.started) {
          state = Object.assign(state, data);
          return true;
        }
      }
    } catch (e) {}
    return false;
  }

  function clearState() {
    localStorage.removeItem(STORAGE_KEY);
    state = {
      started: false,
      minDays: 10,
      maxDays: 20,
      secretDay: null,
      fakeDays: [],
      currentDay: 1,
      photos: [],
      teaseProbability: 0.8
    };
  }

  // ========== 工具 ==========
  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  function setBackground(show) {
    if (show && state.photos.length > 0) {
      const idx = Math.floor(Math.random() * state.photos.length);
      bgLayer.style.backgroundImage = `url(${state.photos[idx]})`;
      bgLayer.style.display = 'block';
      bgOverlay.style.display = 'block';
    } else {
      bgLayer.style.display = 'none';
      bgOverlay.style.display = 'none';
      bgLayer.style.backgroundImage = '';
    }
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateSecretAndFakes() {
    const min = state.minDays;
    const max = state.maxDays;
    state.secretDay = randInt(min, max);

    // 假射精日：最多 2 個，必須 > minDays 且 < secretDay
    state.fakeDays = [];
    const possible = [];
    for (let d = min + 1; d < state.secretDay; d++) {
      possible.push(d);
    }
    // 打亂後取最多 2 個
    for (let i = possible.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [possible[i], possible[j]] = [possible[j], possible[i]];
    }
    const count = Math.min(2, possible.length);
    // 有機會少於 2 個（甚至 0）
    const actualCount = Math.floor(Math.random() * (count + 1));
    state.fakeDays = possible.slice(0, actualCount).sort((a,b) => a-b);
  }

  // ========== 開始設定 ==========
  photoInput.addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    const readers = files.map(file => {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    });

    Promise.all(readers).then(results => {
      state.photos = state.photos.concat(results);
      renderPhotoPreview();
    });
  });

  function renderPhotoPreview() {
    photoPreview.innerHTML = '';
    state.photos.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      photoPreview.appendChild(img);
    });
  }

  startBtn.addEventListener('click', function() {
    let min = parseInt(minDaysInput.value, 10) || 10;
    let max = parseInt(maxDaysInput.value, 10) || 20;
    if (min < 1) min = 1;
    if (max < min) max = min;
    if (max > 365) max = 365;

    state.minDays = min;
    state.maxDays = max;
    state.currentDay = 1;
    state.teaseProbability = 0.8;
    state.started = true;
    generateSecretAndFakes();
    saveState();
    enterDaily();
  });

  // ========== 每日畫面 ==========
  function enterDaily() {
    setBackground(false);
    currentDayNum.textContent = state.currentDay;
    dailyStatus.textContent = '今天不准射精';
    dailyStatus.className = 'status-text forbid';
    nextDayBtn.style.display = 'block';
    showScreen('daily');
    saveState();
  }

  nextDayBtn.addEventListener('click', function() {
    state.currentDay += 1;
    saveState();

    const day = state.currentDay;
    if (day === state.secretDay || state.fakeDays.includes(day)) {
      isRealClimax = (day === state.secretDay);
      setBackground(true);
      showScreen('climaxIntro');
    } else {
      currentDayNum.textContent = day;
      saveState();
    }
  });

  // ========== 倒數流程 ==========
  startCountdownBtn.addEventListener('click', function() {
    startCountdown();
  });

  function startCountdown() {
    showScreen('countdown');
    let remaining = 100;
    state.teaseProbability = 0.8;
    teaseMsg.textContent = '';
    countdownNum.textContent = remaining;

    if (countdownInterval) clearInterval(countdownInterval);

    countdownInterval = setInterval(() => {
      remaining -= 1;
      countdownNum.textContent = remaining;

      if (remaining <= 3 && remaining > 0) {
        // 戲弄判斷
        if (Math.random() < state.teaseProbability) {
          remaining += 20;
          countdownNum.textContent = remaining;
          state.teaseProbability *= 0.8;
          teaseMsg.textContent = '哈哈，再忍一下～';
          setTimeout(() => { teaseMsg.textContent = ''; }, 1500);
        }
      }

      if (remaining <= 0) {
        clearInterval(countdownInterval);
        countdownInterval = null;
        onCountdownEnd();
      }
    }, 1000);
  }

  function onCountdownEnd() {
    if (!isRealClimax) {
      // 假射精日
      showScreen('fakeResult');
      setTimeout(() => {
        setBackground(false);
        enterDaily();
      }, 2800);
    } else {
      // 真正射精日
      showRealWindow();
    }
  }

  function showRealWindow() {
    showScreen('realWindow');
    let left = 5;
    windowTimer.textContent = `剩餘 ${left} 秒`;

    if (windowInterval) clearInterval(windowInterval);
    windowInterval = setInterval(() => {
      left -= 1;
      windowTimer.textContent = `剩餘 ${left} 秒`;
      if (left <= 0) {
        clearInterval(windowInterval);
        windowInterval = null;
        showScreen('askSuccess');
      }
    }, 1000);
  }

  // ========== 成功 / 失敗 ==========
  successBtn.addEventListener('click', function() {
    clearState();
    setBackground(false);
    showScreen('end');
  });

  failBtn.addEventListener('click', function() {
    // 從第 1 天重新開始，重新抽取
    state.currentDay = 1;
    state.teaseProbability = 0.8;
    generateSecretAndFakes();
    saveState();
    setBackground(false);
    enterDaily();
  });

  restartBtn.addEventListener('click', function() {
    clearState();
    minDaysInput.value = 10;
    maxDaysInput.value = 20;
    photoPreview.innerHTML = '';
    setBackground(false);
    showScreen('setup');
  });

  // ========== 初始化 ==========
  function init() {
    if (loadState()) {
      // 恢復進度
      minDaysInput.value = state.minDays;
      maxDaysInput.value = state.maxDays;
      renderPhotoPreview();

      // 判斷當前是否在特殊日
      const day = state.currentDay;
      if (day === state.secretDay || state.fakeDays.includes(day)) {
        isRealClimax = (day === state.secretDay);
        setBackground(true);
        showScreen('climaxIntro');
      } else {
        enterDaily();
      }
    } else {
      showScreen('setup');
    }
  }

  init();
})();
</script>
</body>
</html>
