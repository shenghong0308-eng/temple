<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挑戰系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* 自訂動畫：卡牌翻轉效果 */
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flipped {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            backface-visibility: hidden;
        }
        .flip-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <header class="bg-gray-800 border-b border-gray-700 p-4 md:px-8 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-400">挑戰系統</h1>
            <p id="subTitleDisplay" class="text-xs md:text-sm text-gray-400 mt-1 italic">每一天都是新的挑戰！</p>
        </div>
        <div class="bg-gradient-to-r from-amber-500 to-orange-600 px-4 py-2 rounded-full shadow-md text-sm md:text-base font-bold flex items-center gap-1">
            🔥 已堅持 <span id="streakDisplay">0</span> 天
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4">
        <div id="mainContainer" class="w-full max-w-md bg-gray-800 rounded-2xl p-6 shadow-2xl border border-gray-700 min-h-[300px] flex flex-col justify-between">
            
            <div id="noTaskView" class="flex-grow flex flex-col items-center justify-center gap-4 text-center">
                <div class="text-5xl">🎯</div>
                <h3 class="text-xl font-bold text-gray-300">今天想挑戰點什麼？</h3>
                <p class="text-sm text-gray-500 max-w-xs">系統將根據你設定的任務庫與動態機率公式，為你抽出今日的最佳考驗！</p>
                <button onclick="drawTask()" class="w-full mt-4 bg-gradient-to-r from-blue-500 to-teal-500 hover:from-blue-600 hover:to-teal-600 text-white font-bold py-3 px-6 rounded-xl transition duration-300 shadow-lg active:scale-95 cursor-pointer">
                    🎲 抽取今日任務
                </button>
            </div>

            <div id="taskActiveView" class="hidden flex-grow flex flex-col justify-between">
                <div class="flip-card w-full flex-grow flex items-center justify-center py-4">
                    <div id="flipCardInner" class="flip-card-inner w-full bg-gray-700 rounded-xl p-6 border border-gray-600 shadow-inner flex flex-col gap-3 min-h-[200px]">
                        <div>
                            <span id="taskTypeBadge" class="text-xs px-2. py-1 rounded bg-blue-900 text-blue-200 font-semibold">常規型</span>
                            <h2 id="taskNameDisplay" class="text-2xl font-black text-white mt-2">任務名稱</h2>
                        </div>
                        <hr class="border-gray-600">
                        <p id="taskContentDisplay" class="text-gray-300 text-base flex-grow">任務內容載入中...</p>
                    </div>
                </div>

                <div class="flex gap-3 mt-4">
                    <button onclick="abandonTask()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-gray-300 font-bold py-3 rounded-xl transition duration-200 active:scale-95 cursor-pointer">
                        放棄
                    </button>
                    <button onclick="completeTask()" class="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md active:scale-95 cursor-pointer">
                        ✔️ 完成任務
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer class="p-4 flex justify-center bg-gray-900">
        <button onclick="toggleModal(true)" class="bg-gray-800 border border-gray-700 hover:bg-gray-700 text-gray-300 text-sm font-semibold py-2.5 px-6 rounded-xl transition shadow-md flex items-center gap-2 cursor-pointer">
            ⚙️ 管理任務庫 & 里程碑
        </button>
    </footer>

    <div id="mgmtModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 w-full max-w-2xl h-[85vh] rounded-2xl border border-gray-700 flex flex-col shadow-2xl overflow-hidden">
            
            <div class="bg-gray-800 border-b border-gray-700 flex justify-between items-center px-4 md:px-6 py-3">
                <div class="flex gap-2">
                    <button id="tabTaskBtn" onclick="switchTab('task')" class="text-base font-bold px-3 py-1.5 border-b-2 border-blue-500 text-blue-400 cursor-pointer">任務管理</button>
                    <button id="tabMileBtn" onclick="switchTab('mile')" class="text-base font-bold px-3 py-1.5 border-b-2 border-transparent text-gray-400 hover:text-gray-200 cursor-pointer">里程碑語錄</button>
                </div>
                <button onclick="toggleModal(false)" class="text-gray-400 hover:text-gray-200 text-2xl font-bold cursor-pointer">&times;</button>
            </div>

            <div class="flex-grow overflow-y-auto p-4 md:p-6 space-y-6">
                
                <div id="tabTaskSection" class="space-y-6">
                    <form id="taskForm" onsubmit="addTask(event)" class="bg-gray-700/50 p-4 rounded-xl border border-gray-600/50 space-y-3">
                        <h4 class="text-sm font-bold text-gray-300 border-l-4 border-blue-500 pl-2">新增任務 (決定初始權重)</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input type="text" id="inputTaskName" placeholder="任務名稱（例：每天深蹲）" required class="bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                            <input type="number" id="inputTaskWeight" placeholder="初始權重（預設 100）" min="1" value="100" required class="bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="w-full">
                            <select id="inputTaskType" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                                <option value="regular">【常規型】權重永遠保持初始值</option>
                                <option value="linear_inc">【線性遞增型】權重 = 初始值 + 堅持天數</option>
                                <option value="exp_inc">【指數遞增型】權重 = 初始值 * (1.1^堅持天數)</option>
                                <option value="linear_dec">【線性遞減型】權重 = 初始值 - 堅持天數 (下限 1)</option>
                                <option value="exp_dec">【指數遞減型】權重 = 初始值 * (0.9^堅持天數) (下限 1)</option>
                            </select>
                        </div>
                        <textarea id="inputTaskContent" placeholder="任務具體內容與要求..." rows="2" required class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-sm transition cursor-pointer">加入任務庫</button>
                    </form>

                    <div class="space-y-2">
                        <h4 class="text-sm font-bold text-gray-300">目前任務庫清單</h4>
<div class="bg-gray-700/40 border border-gray-600 rounded-xl p-3 my-2 flex justify-between items-center text-xs font-mono">
    <div class="text-gray-400">總初始權重：<span id="totalBaseWeight" class="font-bold text-teal-400 text-sm">0</span></div>
    <div class="text-gray-400">今日加權總總計：<span id="totalCurrentWeight" class="font-bold text-amber-400 text-sm">0</span></div>
</div>
                        <div class="overflow-x-auto rounded-lg border border-gray-700">
                            <table class="w-full text-left text-xs bg-gray-800">
                                <thead class="bg-gray-700 text-gray-300 uppercase">
                                    <tr>
                                        <th class="p-3">名稱</th>
                                        <th class="p-3">型態</th>
                                        <th class="p-3">初始/當前權重</th>
                                        <th class="p-3 text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="taskTableBody" class="divide-y divide-gray-700">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="tabMileSection" class="hidden space-y-6">
                    <form id="mileForm" onsubmit="addMilestone(event)" class="bg-gray-700/50 p-4 rounded-xl border border-gray-600/50 space-y-3">
                        <h4 class="text-sm font-bold text-gray-300 border-l-4 border-teal-500 pl-2">設定堅持天數里程碑語錄</h4>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                            <input type="number" id="inputMileDays" placeholder="指定天數（例：7）" min="1" required class="md:col-span-1 bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                            <input type="text" id="inputMileText" placeholder="觸發時顯示的一句話（無數句可輸入）" required class="md:col-span-3 bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-lg text-sm transition cursor-pointer">儲存里程碑</button>
                    </form>

                    <div class="space-y-2">
                        <h4 class="text-sm font-bold text-gray-300">已設定的里程碑</h4>
                        <div class="overflow-x-auto rounded-lg border border-gray-700">
                            <table class="w-full text-left text-xs bg-gray-800">
                                <thead class="bg-gray-700 text-gray-300">
                                    <tr>
                                        <th class="p-3 w-24">達成天數</th>
                                        <th class="p-3">解鎖語錄內容</th>
                                        <th class="p-3 text-center w-20">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="mileTableBody" class="divide-y divide-gray-700">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="celebrationModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[60]">
        <div class="bg-gradient-to-b from-gray-800 to-gray-900 border-2 border-amber-500 rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <div class="text-6xl animate-bounce">🎉</div>
            <h2 class="text-2xl font-black text-amber-400">達成新里程碑！</h2>
            <p id="celebrationDays" class="text-sm font-bold text-gray-400"></p>
            <div class="bg-gray-700/50 p-4 rounded-xl border border-gray-600 my-2">
                <p id="celebrationText" class="text-white font-medium text-base italic"></p>
            </div>
            <button onclick="closeCelebration()" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2.5 rounded-xl shadow-lg transition cursor-pointer">
                收到！繼續堅持！
            </button>
        </div>
    </div>

    <script>
        // --- 初始化資料庫與狀態變數 ---
        let appState = {
            streak: 0,              // 目前堅持天數
            tasks: [],              // 任務庫陣列
            milestones: [],         // 里程碑語錄陣列
            currentTask: null       // 今日抽中並正在執行的任務
        };

        // 任務類型中文字典對照
        const typeMapping = {
            regular: '常規型',
            linear_inc: '線性遞增',
            exp_inc: '指數遞增',
            linear_dec: '線性遞減',
            exp_dec: '指數遞減'
        };

        // 網頁加載時自動讀取 localStorage 本地資料 (條件 6)
        window.onload = function() {
            const savedState = localStorage.getItem('challenge_system_state');
            if (savedState) {
                appState = JSON.parse(savedState);
            }
            renderMainView();
            renderSubTitle();
            updateStreakDisplay();
        };

        // 儲存目前狀態至 localStorage (條件 6)
        function saveToStorage() {
            localStorage.setItem('challenge_system_state', JSON.stringify(appState));
        }

        // --- 核心演算法：計算動態權重 (條件 5) ---
        function calculateCurrentWeight(task, streak) {
            const base = Number(task.baseWeight);
            const n = Number(streak);
            let current = base;

            switch(task.type) {
                case 'linear_inc':
                    current = base + n;
                    break;
                case 'exp_inc':
                    current = base * Math.pow(1.1, n);
                    break;
                case 'linear_dec':
                    current = base - n;
                    if (current < 1) current = 1;
                    break;
                case 'exp_dec':
                    current = base * Math.pow(0.9, n);
                    if (current < 1) current = 1;
                    break;
                case 'regular':
                default:
                    current = base;
                    break;
            }
            return Math.round(current * 10) / 10; // 保留一位小數
        }

        // --- 核心演算法：加權隨機抽取 (條件 3) ---
        function drawTask() {
            if (appState.tasks.length === 0) {
                alert('請先打開管理後台，在任務庫中新增至少一個任務！');
                toggleModal(true);
                return;
            }

            // 1. 計算所有任務的實時權重與總和
            let totalWeight = 0;
            const tasksWithWeights = appState.tasks.map(task => {
                const w = calculateCurrentWeight(task, appState.streak);
                totalWeight += w;
                return { ...task, tempWeight: w };
            });

            // 2. 隨機數滾輪
            let randomRoll = Math.random() * totalWeight;
            let selectedTask = null;

            // 3. 遍歷加權區間
            for (let task of tasksWithWeights) {
                randomRoll -= task.tempWeight;
                if (randomRoll <= 0) {
                    selectedTask = task;
                    break;
                }
            }

            // 防呆與極端安全處理
            if (!selectedTask) selectedTask = appState.tasks[0];

            // 4. 更新狀態
            appState.currentTask = selectedTask;
            saveToStorage();
            renderMainView();
        }

        // --- 主視覺視窗動態渲染 ---
        function renderMainView() {
            const noTaskView = document.getElementById('noTaskView');
            const taskActiveView = document.getElementById('taskActiveView');

            if (appState.currentTask) {
                // 已有任務，切換至任務卡片介面
                noTaskView.classList.add('hidden');
                taskActiveView.classList.remove('hidden');

                document.getElementById('taskTypeBadge').innerText = typeMapping[appState.currentTask.type];
                document.getElementById('taskNameDisplay').innerText = appState.currentTask.name;
                document.getElementById('taskContentDisplay').innerText = appState.currentTask.content;
            } else {
                // 尚未抽取
                noTaskView.classList.remove('hidden');
                taskActiveView.classList.add('hidden');
            }
        }

        // 更新天數UI
        function updateStreakDisplay() {
            document.getElementById('streakDisplay').innerText = appState.streak;
        }

        // 渲染或更新符合當前天數的最新副標題 (條件 7)
        function renderSubTitle() {
            const subTitleDisplay = document.getElementById('subTitleDisplay');
            // 篩選出所有小於等於目前天數的里程碑，並依天數由大到小排序，取最新生效的一筆
            const availableMilestones = appState.milestones
                .filter(m => Number(m.days) <= appState.streak)
                .sort((a, b) => Number(b.days) - Number(a.days));

            if (availableMilestones.length > 0) {
                subTitleDisplay.innerText = availableMilestones[0].text;
            } else {
                subTitleDisplay.innerText = "每一天都是新的挑戰！";
            }
        }

        // --- 行動與按鈕事件 ---
        function completeTask() {
            appState.streak += 1;
            const newStreak = appState.streak;
            appState.currentTask = null; // 清空今日任務
            
            updateStreakDisplay();
            renderMainView();
            saveToStorage();

            // 檢查是否剛好觸發里程碑賀詞彈窗 (條件 7)
            const matchedMilestone = appState.milestones.find(m => Number(m.days) === newStreak);
            if (matchedMilestone) {
                document.getElementById('celebrationDays').innerText = `🏆 第 ${newStreak} 天達成紀錄`;
                document.getElementById('celebrationText').innerText = matchedMilestone.text;
                document.getElementById('celebrationModal').classList.remove('hidden');
            }

            renderSubTitle();
        }

        function closeCelebration() {
            document.getElementById('celebrationModal').classList.add('hidden');
        }

        function abandonTask() {
            if (confirm('確定要放棄今日抽到的任務嗎？將會重新回到抽取介面。')) {
                appState.currentTask = null;
                saveToStorage();
                renderMainView();
            }
        }

        // --- 後台管理彈窗邏輯 (條件 3) ---
        function toggleModal(show) {
            const modal = document.getElementById('mgmtModal');
            if (show) {
                modal.classList.remove('hidden');
                renderTaskTable();
                renderMilestoneTable();
            } else {
                modal.classList.add('hidden');
            }
        }

        function switchTab(tab) {
            const taskBtn = document.getElementById('tabTaskBtn');
            const mileBtn = document.getElementById('tabMileBtn');
            const taskSection = document.getElementById('tabTaskSection');
            const mileSection = document.getElementById('tabMileSection');

            if (tab === 'task') {
                taskBtn.className = "text-base font-bold px-3 py-1.5 border-b-2 border-blue-500 text-blue-400 cursor-pointer";
                mileBtn.className = "text-base font-bold px-3 py-1.5 border-b-2 border-transparent text-gray-400 hover:text-gray-200 cursor-pointer";
                taskSection.classList.remove('hidden');
                mileSection.classList.add('hidden');
            } else {
                mileBtn.className = "text-base font-bold px-3 py-1.5 border-b-2 border-teal-500 text-teal-400 cursor-pointer";
                taskBtn.className = "text-base font-bold px-3 py-1.5 border-b-2 border-transparent text-gray-400 hover:text-gray-200 cursor-pointer";
                mileSection.classList.remove('hidden');
                taskSection.classList.add('hidden');
            }
        }

        // --- 任務庫資料操作表單與表格渲染 ---
        function addTask(e) {
            e.preventDefault();
            const name = document.getElementById('inputTaskName').value.trim();
            const baseWeight = document.getElementById('inputTaskWeight').value;
            const type = document.getElementById('inputTaskType').value;
            const content = document.getElementById('inputTaskContent').value.trim();

            const newTask = {
                id: 'task_' + Date.now(),
                name,
                baseWeight: Number(baseWeight),
                type,
                content
            };

            appState.tasks.push(newTask);
            saveToStorage();
            renderTaskTable();
            document.getElementById('taskForm').reset();
            document.getElementById('inputTaskWeight').value = 100; // 恢復預設
        }

        function deleteTask(id) {
            appState.tasks = appState.tasks.filter(t => t.id !== id);
            // 如果刪除的剛好是正在執行的任務，同步清空
            if (appState.currentTask && appState.currentTask.id === id) {
                appState.currentTask = null;
                renderMainView();
            }
            saveToStorage();
            renderTaskTable();
        }

        function renderTaskTable() {
    const tbody = document.getElementById('taskTableBody');
    tbody.innerHTML = '';

    // 🔥 新增：初始化總權數暫存變數
    let totalBase = 0;
    let totalCurrent = 0;

    if (appState.tasks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">目前任務庫空空如也...</td></tr>`;
        // 🔥 新增：沒任務時歸零
        if(document.getElementById('totalBaseWeight')) {
            document.getElementById('totalBaseWeight').innerText = 0;
            document.getElementById('totalCurrentWeight').innerText = 0;
        }
        return;
    }

    appState.tasks.forEach(task => {
        const curW = calculateCurrentWeight(task, appState.streak);
        
        // 🔥 新增：遍歷時順便累加初始與當前權重
        totalBase += Number(task.baseWeight);
        totalCurrent += curW;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-700/40 transition";
        tr.innerHTML = `
            <td class="p-3">
                <div class="font-bold text-gray-200">${task.name}</div>
                <div class="text-[10px] text-gray-400 max-w-[150px] truncate">${task.content}</div>
            </td>
            <td class="p-3 text-gray-300">${typeMapping[task.type]}</td>
            <td class="p-3 font-mono text-teal-400">${task.baseWeight} &rarr; <span class="font-bold text-amber-400">${curW}</span></td>
            <td class="p-3 text-center">
                <button onclick="deleteTask('${task.id}')" class="bg-red-900/60 hover:bg-red-800 text-red-200 px-2 py-1 rounded transition text-[11px] cursor-pointer">刪除</button>
            </td>
        `;
        tbody.appendChild(tr);
    });

    // 🔥 新增：把累加後的總權數更新至剛才新增的小視窗中
    if(document.getElementById('totalBaseWeight')) {
        document.getElementById('totalBaseWeight').innerText = totalBase;
        document.getElementById('totalCurrentWeight').innerText = Math.round(totalCurrent * 10) / 10;
    }
}

        // --- 里程碑語錄資料操作表單與表格渲染 ---
        function addMilestone(e) {
            e.preventDefault();
            const days = document.getElementById('inputMileDays').value;
            const text = document.getElementById('inputMileText').value.trim();

            // 檢查是否重複設定天數，若重複則覆蓋
            appState.milestones = appState.milestones.filter(m => Number(m.days) !== Number(days));

            appState.milestones.push({
                days: Number(days),
                text: text
            });

            // 排序里程碑（依天數從小到大）
            appState.milestones.sort((a, b) => a.days - b.days);

            saveToStorage();
            renderMilestoneTable();
            renderSubTitle();
            document.getElementById('mileForm').reset();
        }

        function deleteMilestone(days) {
            appState.milestones = appState.milestones.filter(m => Number(m.days) !== Number(days));
            saveToStorage();
            renderMilestoneTable();
            renderSubTitle();
        }

        function renderMilestoneTable() {
            const tbody = document.getElementById('mileTableBody');
            tbody.innerHTML = '';

            if (appState.milestones.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">目前尚未設定任何天數里程碑。</td></tr>`;
                return;
            }

            appState.milestones.forEach(m => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-700/40 transition";
                tr.innerHTML = `
                    <td class="p-3 font-mono font-bold text-amber-400 text-center">${m.days} 天</td>
                    <td class="p-3 text-gray-200">${m.text}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteMilestone(${m.days})" class="bg-red-900/60 hover:bg-red-800 text-red-200 px-2 py-1 rounded transition text-[11px] cursor-pointer">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
